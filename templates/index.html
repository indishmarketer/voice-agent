<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand }} — Voice Assistant</title>
    <script>
        // Applied before the stylesheet loads, so a saved preference never
        // flashes the wrong theme for a frame. app.js owns the toggle itself.
        try {
            var __theme = localStorage.getItem("theme");
            if (__theme === "light" || __theme === "dark") {
                document.documentElement.setAttribute("data-theme", __theme);
            }
        } catch (_) {}
    </script>
    <link rel="icon" type="image/png" href="{{ favicon_url }}">
    <link rel="apple-touch-icon" href="{{ apple_touch_icon_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset('style.css') }}">
    {% if turnstile_site_key %}
    <script>
        // Defined BEFORE the Turnstile script tag below, so there is no race:
        // the CDN script calls this itself, once it has actually finished
        // loading, rather than us guessing via turnstile.ready().
        window.__turnstileLoaded = false;
        window.onTurnstileLoad = function () {
            window.__turnstileLoaded = true;
            if (window.__onTurnstileReady) window.__onTurnstileReady();
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
    {% endif %}
</head>
<body>
    <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

    <button id="btn-theme" class="btn-theme-toggle" aria-label="Toggle light and dark theme" type="button"></button>

    <div class="app-container">

        <!-- Welcome / Dial Screen -->
        <div id="dial-screen" class="screen active">
            <div class="brand">
                <div class="logo">
                    <img src="{{ logo_url }}" alt="{{ brand }}">
                </div>
                <h1>{{ brand }}</h1>
                <p>{{ tagline }}</p>
            </div>

            <button id="btn-dial" class="btn-dial" aria-label="Start call">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 16.92V19.92C22 20.4504 21.7893 20.9591 21.4142 21.3342C21.0391 21.7093 20.5304 21.92 20 21.92C16.897 21.7374 13.9015 20.6974 11.27 18.9C8.82483 17.2644 6.73557 15.1752 5.09999 12.73C3.2952 10.0863 2.25368 7.07849 2.07999 3.95999C2.07999 3.42956 2.29071 2.92084 2.66578 2.54577C3.04085 2.1707 3.54956 1.95999 4.07999 1.95999H7.07999C7.52554 1.95546 7.95874 2.11585 8.30064 2.41214C8.64253 2.70842 8.8703 3.12134 8.94999 3.56999C9.07662 4.52988 9.31343 5.4716 9.65499 6.37999C9.79153 6.74109 9.80582 7.13521 9.69466 7.50503C9.5835 7.87484 9.35246 8.20092 9.03499 8.44999L6.76499 10.72C8.18843 13.2246 10.2354 15.2716 12.74 16.695L15.01 14.425C15.2591 14.1075 15.5851 13.8765 15.955 13.7653C16.3248 13.6542 16.7189 13.6685 17.08 13.805C17.9884 14.1466 18.9301 14.3834 19.89 14.51C20.3421 14.5902 20.7583 14.8213 21.0567 15.1678C21.3552 15.5143 21.5146 15.9515 21.5 16.4V16.92H22Z" fill="white"/>
                </svg>
            </button>
            <div class="dial-text">Tap to Call</div>
            <p class="mic-hint">
                Your microphone is used only while you are speaking. Calls are
                limited to a few minutes each.
            </p>
            <p class="powered-by">Powered by <span class="powered-by-highlight">pollinations.ai</span></p>
            <div id="turnstile-holder"></div>
        </div>

        <!-- Active Call Screen -->
        <div id="call-screen" class="screen">
            <div class="call-header">
                <div class="agent-orb" id="agent-orb" aria-hidden="true">
                    <div class="ring"></div>
                    <div class="core">
                        <img src="{{ logo_url }}" alt="">
                    </div>
                </div>
                <h2>{{ agent_name }}</h2>
                <div id="call-status" class="call-status">Connecting…</div>
                <div id="call-timer" class="call-timer">--:--</div>
            </div>

            <div class="audio-waves" id="audio-waves">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>

            <div class="transcript-box">
                <div id="transcript-text" class="transcript-text">Calling…</div>
            </div>

            <!-- The agent collects name/email/phone by voice, one at a time,
                 in the transcript box above like any other turn. This card
                 only ever appears as a fallback - the caller said the spoken
                 read-back was wrong, or voice capture couldn't get a clean
                 answer - so it is an overlay, not squeezed into a fixed-size
                 box in the normal call layout. -->
            <div id="contact-card" class="contact-card">
                <div class="contact-card-inner">
                    <div class="contact-card-title">Your details</div>
                    <label class="contact-field">
                        <span>Name</span>
                        <input id="contact-name" type="text" autocomplete="name"
                               placeholder="Your name">
                    </label>
                    <label class="contact-field">
                        <span>Email</span>
                        <input id="contact-email" type="email" autocomplete="email"
                               placeholder="you@example.com">
                    </label>
                    <label class="contact-field">
                        <span>Phone <em>(optional)</em></span>
                        <input id="contact-phone" type="tel" autocomplete="tel"
                               placeholder="Phone number">
                    </label>
                    <div class="contact-card-actions">
                        <button id="btn-contact-skip" class="btn-text" type="button">Not now</button>
                        <button id="btn-contact-confirm" class="btn-primary" type="button" disabled>Confirm</button>
                    </div>
                </div>
            </div>

            <div class="call-controls">
                <button id="btn-mute" class="btn-control btn-mute" aria-label="Mute microphone">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" fill="currentColor"/>
                        <path d="M19 11a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                        <path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button id="btn-end" class="btn-control end-call" aria-label="End call">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 16.92V19.92C22 20.4504 21.7893 20.9591 21.4142 21.3342C21.0391 21.7093 20.5304 21.92 20 21.92C16.897 21.7374 13.9015 20.6974 11.27 18.9C8.82483 17.2644 6.73557 15.1752 5.09999 12.73C3.2952 10.0863 2.25368 7.07849 2.07999 3.95999C2.07999 3.42956 2.29071 2.92084 2.66578 2.54577C3.04085 2.1707 3.54956 1.95999 4.07999 1.95999H7.07999C7.52554 1.95546 7.95874 2.11585 8.30064 2.41214C8.64253 2.70842 8.8703 3.12134 8.94999 3.56999C9.07662 4.52988 9.31343 5.4716 9.65499 6.37999C9.79153 6.74109 9.80582 7.13521 9.69466 7.50503C9.5835 7.87484 9.35246 8.20092 9.03499 8.44999L6.76499 10.72C8.18843 13.2246 10.2354 15.2716 12.74 16.695L15.01 14.425C15.2591 14.1075 15.5851 13.8765 15.955 13.7653C16.3248 13.6542 16.7189 13.6685 17.08 13.805C17.9884 14.1466 18.9301 14.3834 19.89 14.51C20.3421 14.5902 20.7583 14.8213 21.0567 15.1678C21.3552 15.5143 21.5146 15.9515 21.5 16.4V16.92H22Z" fill="white" transform="rotate(135 12 12)"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="notice" class="notice"></div>
    </div>

    <script>
        window.__TURNSTILE_SITE_KEY__ = {{ (turnstile_site_key or "") | tojson }};
    </script>
    <script src="{{ asset('app.js') }}"></script>
</body>
</html>
