<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Voice Agent Admin</title>
    <link rel="icon" type="image/png" href="{{ asset('img/favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f7fb; --panel: #ffffff; --border: #e8eaf0;
            --text-main: #14161f; --text-muted: #6b7086;
            --primary: #4f5bd5; --primary-hover: #3f4bc4;
            --danger: #dc2626; --success: #16a34a;
            --shadow: 0 1px 2px rgba(20,22,40,.04), 0 1px 12px rgba(20,22,40,.04);
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0c11; --panel: #14161d; --border: rgba(255,255,255,.08);
                --text-main: #f3f4f6; --text-muted: #9497a8;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 12px rgba(0,0,0,.25);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-main);
            font: 14.5px/1.5 'Inter', system-ui, -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            width: 100%; max-width: 360px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 32px 28px; box-shadow: var(--shadow); text-align: center;
        }
        .card img { width: 48px; height: 48px; border-radius: 13px; margin-bottom: 14px; }
        h1 { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
        p.hint { color: var(--text-muted); font-size: 13.5px; margin: 0 0 20px; }
        input[type=email] {
            width: 100%; font-family: inherit; font-size: 13.5px; color: var(--text-main);
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 9px; padding: 10px 12px; outline: none; margin-bottom: 14px;
            transition: border-color .12s ease;
        }
        input[type=email]:focus { border-color: var(--primary); }
        button {
            width: 100%; font-family: inherit; background: var(--primary); color: #fff;
            border: 0; border-radius: 9px; padding: 11px 16px;
            font-size: 13.5px; font-weight: 600; cursor: pointer;
            transition: background-color .12s ease;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .status-msg { font-size: 13px; margin-top: 14px; color: var(--success); }
        .status-msg.err { color: var(--danger); }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ asset('img/logo.png') }}" alt="">
        <h1>Admin sign-in</h1>
        <p class="hint">Enter your admin email and we'll send you a one-time sign-in link.</p>
        <form id="login-form">
            <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
            <button type="submit" id="submit-btn">Send sign-in link</button>
        </form>
        <div id="out" class="status-msg"></div>
    </div>
    <script>
        const form = document.getElementById("login-form");
        const out = document.getElementById("out");
        const btn = document.getElementById("submit-btn");

        if (new URLSearchParams(location.search).get("error")) {
            out.textContent = "That link was invalid or has expired. Request a new one below.";
            out.className = "status-msg err";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            btn.disabled = true;
            out.textContent = "Sending…";
            out.className = "status-msg";
            try {
                const res = await fetch("/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: document.getElementById("email").value.trim() }),
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    out.textContent = "If that address has admin access, a sign-in link is on its way. Check your inbox.";
                    out.className = "status-msg";
                } else {
                    out.textContent = data.error || "Something went wrong. Please try again.";
                    out.className = "status-msg err";
                }
            } catch (_) {
                out.textContent = "Network error - please try again.";
                out.className = "status-msg err";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
